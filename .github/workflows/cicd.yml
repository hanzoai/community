# Every knob lives in /hanzo.yml; the build, test and publish are hanzoai/ci's.
name: CI/CD
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: hanzoai/ci/.github/workflows/build.yml@98d362421f11cebce7aaa8f30ac6e8504be974de
    secrets: inherit
