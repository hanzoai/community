# Every knob lives in /hanzo.yml; the build, test and publish are hanzoai/ci's.
name: CI/CD
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: hanzoai/ci/.github/workflows/build.yml@61d6fcc00da9f9fa6ce4ce14adce3a139a093da5
    secrets: inherit
