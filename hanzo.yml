# Read by hanzoai/ci (.github/workflows/cicd.yml). A Next static export: each
# push to main type-checks, builds out/ and publishes it to the Sites plane as
# project `hanzo-community`, the project whose key the page sends with.
test:
  - name: typecheck
    run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm build

site:
  slug: hanzo-community
  dir: out
  # No build: the gate builds the export, and hanzoai/ci carries the bytes it
  # tested to the publish job instead of that job installing and building again.
  on: [main]

# The KMS tenant that holds the Sites plane deploy token.
kms:
  org: hanzo

